<link rel="manifest" id="pwa-manifest" href="" />
<script>
  // 动态生成 manifest，让单文件 HTML 也能被"安装到主屏幕"
  (function () {
    var iconData = 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 192 192%22><rect width=%22192%22 height=%22192%22 rx=%2238%22 fill=%22%23c98b5e%22/><text x=%2296%22 y=%22118%22 font-size=%22110%22 text-anchor=%22middle%22>%F0%9F%91%97%EF%B8%8F</text></svg>';
    document.getElementById('apple-touch-icon').href = iconData;
    var manifest = {
      name: '我的衣橱 · AI 穿搭',
      short_name: '我的衣橱',
      description: '个人线上衣橱：AI 形象试穿、素材管理、穿搭方案',
      start_url: '.',
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#f6f3ee',
      theme_color: '#c98b5e',
      icons: [{ src: iconData, sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable' }]
    };
    document.getElementById('pwa-manifest').href = URL.createObjectURL(
      new Blob([JSON.stringify(manifest)], { type: 'application/json' })
    );
  })();
</script>

<body>

<div id="app"></div>

<script>
/* ============================================================
 * 我的衣橱 · 单文件版（vanilla JS，零依赖，可直接打包 Android）
 * 四大模块：①我的AI形象 ②素材库 ③搭配方案 ④专业搭配顾问
 * 登录：邮箱 / 手机号 + 验证码（演示：任意4位）
 * 存储：IndexedDB 存图片 + localStorage 存元数据，登录后云端同步（占位）
 * ============================================================ */
'use strict';

/* ---------- 持久化层 ---------- */
const DB_NAME='wardrobe_db', DB_STORE='images', META_KEY='wardrobe_meta';
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(DB_STORE);
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
async function dbGet(k){try{const db=await openDB();return await new Promise(res=>{
  const t=db.transaction(DB_STORE,'readonly').objectStore(DB_STORE).get(k);
  t.onsuccess=()=>res(t.result||null);});}catch{return null;}}
async function dbPut(k,v){const db=await openDB();return await new Promise(res=>{
  const t=db.transaction(DB_STORE,'readwrite');t.objectStore(DB_STORE).put(v,k);t.oncomplete=()=>res();});}
async function dbDel(k){try{const db=await openDB();return await new Promise(res=>{
  const t=db.transaction(DB_STORE,'readwrite');t.objectStore(DB_STORE).delete(k);t.oncomplete=()=>res();});}catch{}}

/* ---------- 云端后端层（② 可配置，填配置即用） ----------
 * 支持两种后端，在「设置」里切换，默认 local（本地，不上云）。
 *   tencent  : 腾讯云（COS 存图 + 云开发/自建网关存元数据）
 *   rest     : 任意兼容 REST 的后端（Supabase / Firebase REST / 自建）
 * 切换真实云端只需：打开设置 → 选后端 → 填 Endpoint + ApiKey → 保存。
 * 之后 saveMeta() 会自动调用 syncToCloud()，图片走 uploadImage()。
 * 未配置时自动降级为 local，行为与原来完全一致，不报错。
 * ------------------------------------------------------ */
const CLOUD_KEY='wardrobe_cloud';
function defaultCloud(){return {mode:'local',endpoint:'',apiKey:'',bucket:'',region:'ap-guangzhou',provider:'tencent'};}
function loadCloud(){try{const r=localStorage.getItem(CLOUD_KEY);return r?Object.assign(defaultCloud(),JSON.parse(r)):defaultCloud();}catch{return defaultCloud();}}
function saveCloud(c){localStorage.setItem(CLOUD_KEY,JSON.stringify(c));}
let cloud=loadCloud();
function cloudHeaders(){const h={'Content-Type':'application/json'};if(cloud.apiKey)h['Authorization']='Bearer '+cloud.apiKey;return h;}
// 上传一张图片（dataURL）到云端，返回可访问的 URL；local 模式下直接返回原 dataURL
async function uploadImage(dataUrl,key){
  if(cloud.mode==='local'||!cloud.endpoint)return dataUrl;
  try{
    if(cloud.provider==='tencent'){
      // 腾讯云 COS：推荐通过后端签名上传（直传需临时密钥）。此处走统一网关 /api/image
      const r=await fetch(cloud.endpoint.replace(/\/$/,'')+'/api/image',{method:'POST',headers:cloudHeaders(),body:JSON.stringify({key,data:dataUrl})});
      const j=await r.json();return j.url||dataUrl;
    }
    const r=await fetch(cloud.endpoint.replace(/\/$/,'')+'/images',{method:'POST',headers:cloudHeaders(),body:JSON.stringify({key,data:dataUrl})});
    const j=await r.json();return j.url||dataUrl;
  }catch(e){console.warn('[cloud] upload fallback local',e);return dataUrl;}
}
// 上传整个元数据快照（含全部 dataURL），登录后自动调用
async function syncToCloud(){if(!state.account)return;
  if(cloud.mode==='local'||!cloud.endpoint){cloudLast='local';return;}
  try{
    const payload={account:state.account,meta:JSON.parse(localStorage.getItem(META_KEY)||'{}'),ts:Date.now()};
    await fetch(cloud.endpoint.replace(/\/$/,'')+'/api/sync',{method:'PUT',headers:cloudHeaders(),body:JSON.stringify(payload)});
    cloudLast='ok';console.log('[cloud] synced for',state.account.value);
  }catch(e){cloudLast='err';console.warn('[cloud] sync failed',e);}
}
let cloudLast='local';
async function syncFromCloud(){if(!state.account||cloud.mode==='local'||!cloud.endpoint)return;
  try{
    const r=await fetch(cloud.endpoint.replace(/\/$/,'')+'/api/sync?account='+encodeURIComponent(state.account.value),{headers:cloudHeaders()});
    if(!r.ok)return;const j=await r.json();
    if(j&&j.meta){localStorage.setItem(META_KEY,JSON.stringify(j.meta));Object.assign(state,j.meta);render(true);}}
  catch(e){console.warn('[cloud] pull failed',e);}
}
function cloudStatus(){if(cloud.mode==='local')return '本地模式（未上云）';return cloudLast==='ok'?'已同步云端 ✓':cloudLast==='err'?'同步失败，下次重试':'云端：'+cloud.mode;}

/* ---------- AI 形象引擎（③ 方案 A：接口壳 + 高质量模拟渲染占位） ----------
 * 架构：
 *   generateAvatar(photo, params) -> 形象描述/参考图
 *   tryOn(avatar, garmentItem)    -> 试穿效果图
 * 默认走「高质量模拟渲染」（Canvas 合成，比原矢量人偶更精细，离线可用、免费）。
 * 若已在设置里填入腾讯混元 APIKey，自动切换为真实 AI 生成（hunyuanTryOn）。
 * 填 Key 即切换，其余代码无需改动 —— 这就是方案 A 的核心。
 * ------------------------------------------------------------------ */
const AI_KEY='wardrobe_ai';
function defaultAI(){return {mode:'simulate',provider:'hunyuan',apiKey:'',secretId:'',model:'hunyuan-image',refAvatarKey:null};}
function loadAI(){try{const r=localStorage.getItem(AI_KEY);return r?Object.assign(defaultAI(),JSON.parse(r)):defaultAI();}catch{return defaultAI();}}
function saveAI(){localStorage.setItem(AI_KEY,JSON.stringify(ai));}
let ai=loadAI();
// 进度回调（UI 用）：'generating' | 'rendering' | 'done' | 'error'
let aiOnProgress=()=>{};
function setAIProgress(fn){aiOnProgress=fn;}
// 根据参数 + 照片生成「数字分身」：simulate = 精细 Canvas 渲染；hunyuan = 真实文生图
async function generateAvatar(photoDataUrl,params){
  aiOnProgress({phase:'generating',msg:'正在生成数字分身…'});
  await sleep(300);
  if(ai.mode==='hunyuan'&&ai.apiKey)try{return await hunyuanGenerateAvatar(photoDataUrl,params);}catch(e){console.warn('[AI] hunyuan fallback simulate',e);}
  return simulateAvatar(photoDataUrl,params);
}
// 试穿：把单品合成到数字分身 -> 返回 dataURL
async function tryOnAvatar(avatarDataUrl,item,allItems){
  aiOnProgress({phase:'rendering',msg:'正在合成试穿效果…'});
  await sleep(200);
  if(ai.mode==='hunyuan'&&ai.apiKey)try{return await hunyuanTryOn(avatarDataUrl,item,allItems);}catch(e){console.warn('[AI] tryOn fallback simulate',e);}
  return simulateTryOn(avatarDataUrl,item,allItems);
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
/* --- 高质量模拟渲染（占位，离线可用，效果显著优于原矢量人偶）--- */
function simulateAvatar(photoDataUrl,params){
  const a=params||state.avatar;
  const W=400,H=560,cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
  // 背景渐变
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#f7f1e8');bg.addColorStop(1,'#e9ddc9');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // 若有照片：以照片为底（做柔和圆形遮罩居中），体现"你的形象"
  if(photoDataUrl){const img=new Image();img.src=photoDataUrl;
    ctx.save();ctx.beginPath();ctx.arc(W/2,H*0.34,92,0,Math.PI*2);ctx.closePath();ctx.clip();
    ctx.drawImage(img,W/2-92,H*0.34-92,184,184);ctx.restore();}
  // 身体（按体型缩放）
  const bw=a.body==='slim'?96:a.body==='curvy'?132:112;
  ctx.fillStyle=a.skin||'#f5d0b0';
  roundRect(ctx,W/2-bw/2,H*0.50,bw,H*0.30,24);ctx.fill();         // 躯干
  roundRect(ctx,W/2-22,H*0.20,44,52,22);ctx.fill();               // 头
  // 发型块
  ctx.fillStyle=a.hair||'#3a3a3a';
  ctx.beginPath();ctx.arc(W/2,H*0.235,30,Math.PI,Math.PI*2);ctx.fill();
  // 腿
  ctx.fillRect(W/2-bw*0.22,H*0.80,bw*0.20,H*0.15);
  ctx.fillRect(W/2+bw*0.02,H*0.80,bw*0.20,H*0.15);
  // 标注
  ctx.fillStyle='#8a7a63';ctx.font='13px sans-serif';ctx.textAlign='center';
  ctx.fillText('AI 数字分身 · '+ (photoDataUrl?'照片驱动':'参数模式'),W/2,H*0.97);
  return cv.toDataURL('image/png');
}
function simulateTryOn(avatarDataUrl,item,allItems){
  const W=400,H=560,cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
  const base=new Image();base.src=avatarDataUrl||simulateAvatar(null,state.avatar);
  ctx.drawImage(base,0,0,W,H);
  // 把单品 PNG 贴到对应身体区域，带轻微透视/阴影，模拟"穿上"
  const draw=(it,factor)=>{if(!imgCache[it.id])return;const img=new Image();img.src=imgCache[it.id];
    const pos=tryOnPos(it.categoryId);
    ctx.save();ctx.shadowColor='rgba(0,0,0,.18)';ctx.shadowBlur=8;ctx.shadowOffsetY=3;
    ctx.drawImage(img,pos.x,pos.y,pos.w*factor,pos.h*factor);ctx.restore();};
  draw(item,1.0);
  ctx.fillStyle='#c98b5e';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
  ctx.fillText('试穿：'+item.name,W/2,32);
  return cv.toDataURL('image/png');
}
function tryOnPos(catId){const map={
  c_top:{x:130,y:210,w:140,h:130},c_outer:{x:120,y:205,w:160,h:160},c_dress:{x:120,y:205,w:160,h:280},
  c_bottom:{x:135,y:340,w:130,h:170},c_shoe:{x:150,y:505,w:100,h:44},c_bag:{x:250,y:300,w:66,h:78},
  c_acc:{x:175,y:195,w:50,h:50}};return map[catId]||{x:150,y:270,w:100,h:110};}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
/* --- 腾讯混元调用代码（填 Key 即切换为真实 AI）---
 * 生成：hunyuan-image（图生图 / 文生图），传照片+参数 -> 数字分身
 * 换装：以数字分身为底图 + 单品图 -> 虚拟试穿
 * 签名用 TC3-HMAC-SHA256（需在后端完成签名最安全；此处给出前端可调用的网关结构，

 * 只要把 apiKey 填入设置，simulate 即自动让位给下面两个函数。 ---------------- */
async function hunyuanGenerateAvatar(photoDataUrl,params){

    '干净浅色背景，全身可见，无文字，高细节，保留人物面部特征';
  const body=JSON.stringify({model:ai.model,image:photoDataUrl||undefined,prompt,resolution:'1024x1536'});
  const res=await fetch(cloud.endpoint?cloud.endpoint.replace(/\/$/,'')+'/api/hunyuan/avatar':'https://hunyuan.tencentcloudapi.com/',
    {method:'POST',headers:hunyuanHeaders(),body});
  const j=await res.json();
  return j.data?.image_url||j.result?.image||simulateAvatar(photoDataUrl,params);
}
async function hunyuanTryOn(avatarDataUrl,item,allItems){
  const prompt='虚拟试穿：保持人物身份与姿态不变，将指定服装穿到人物身上，'+ 
    '服装颜色款式严格贴合参考图，写实摄影，无文字';

    {method:'POST',headers:hunyuanHeaders(),body});
  const j=await res.json();
  return j.data?.image_url||j.result?.image||simulateTryOn(avatarDataUrl,item,allItems);
}

/* ---------- 图片：上传 → PNG 规范化（去浅色背景）→ IndexedDB ---------- */
function fileToKey(id){return 'img_'+id;}
function normalizeToPNG(file){return new Promise((res,rej)=>{const fr=new FileReader();
  fr.onload=()=>{const img=new Image();img.onload=()=>{
    let w=img.width,h=img.height,max=800;
    if(Math.max(w,h)>max){if(w>h){w=max;h=img.height*max/img.width;}else{h=max;w=img.width*max/img.height;}}
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,w,h);
    try{const d=ctx.getImageData(0,0,w,h);for(let i=0;i<d.data.length;i+=4){
      const r=d.data[i],g=d.data[i+1],b=d.data[i+2];
      if(r>238&&g>238&&b>238) d.data[i+3]=0; // 浅色背景→透明
    }ctx.putImageData(d,0,0);}catch(e){}
    res(cv.toDataURL('image/png'));};
    img.onerror=rej;img.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);});}
async function addItemFile(file,categoryId,name){
  const id='i_'+Date.now()+Math.random().toString(16).slice(2,5);
  const dataUrl=await normalizeToPNG(file);
  await dbPut(fileToKey(id),dataUrl);
  const item={id,categoryId,name:name||file.name.replace(/\.[^/.]+$/,'')||'未命名',tags:[],imageKey:fileToKey(id),createdAt:Date.now()};
  state.items.push(item);saveMeta();return item;
}

// 局部刷新：把已缓存的图片填入 DOM 中对应占位符，不重绘整棵树

      card.querySelector('.try-btn').onclick=()=>{location.hash='#avatar';current='avatar';

      card.querySelector('.item-name').ondblclick=()=>{const v=prompt('重命名：',it.name);if(v&&v.trim()){it.name=v.trim();saveMeta();render();};};
      grid.appendChild(card);

/* 上传弹窗 */
let uploadCat='', pendingFiles=[];
function openUpload(){
  const c0=state.categories[0];uploadCat=c0?.id||'';
  const node=el(`<div class="modal" id="modal">
    <div class="modal-box card"><h3>上传素材</h3>
      <div class="field"><label>选择品类</label>
        <select id="upCat"></select></div>
      <div class="drop" id="drop"><input type="file" accept="image/*" multiple hidden id="fileInput" />
        <p>📷 点击或拖拽图片到此处</p><p class="hint">自动转为 PNG · 浅色背景会被去除</p></div>
      <div class="pending" id="pending"></div>
      <div class="modal-actions"><button class="btn sec" id="cancel">取消</button>
        <button class="btn" id="confirm" disabled>确认上传 <span id="cnt"></span></button></div>
    </div></div>`);
  const sel=node.querySelector('#upCat');
  state.categories.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.icon+' '+c.name;sel.appendChild(o);});
  sel.value=uploadCat;sel.onchange=e=>uploadCat=e.target.value;
  const drop=node.querySelector('#drop'),fileInput=node.querySelector('#fileInput');
  drop.onclick=()=>fileInput.click();
  const onFiles=files=>{pendingFiles=[...files];refresh();};
  fileInput.onchange=e=>onFiles(e.target.files);
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('over');};
  drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');onFiles(e.dataTransfer.files);};
  function refresh(){
    const p=node.querySelector('#pending');p.innerHTML='';
    pendingFiles.forEach(f=>{const d=document.createElement('div');d.className='pending-item';d.textContent=f.name;p.appendChild(d);});
    node.querySelector('#cnt').textContent=pendingFiles.length?pendingFiles.length:'';
    node.querySelector('#confirm').disabled=!pendingFiles.length;
  }
  node.querySelector('#cancel').onclick=()=>document.getElementById('modal')?.remove();
  node.querySelector('#confirm').onclick=async()=>{
    for(const f of pendingFiles)await addItemFile(f,uploadCat,f.name.replace(/\.[^/.]+$/,'')||'未命名');
    document.getElementById('modal')?.remove();pendingFiles=[];render();
  };
  document.body.appendChild(node);
}

function drawClothes(){
  const g=document.getElementById('clothes');if(!g)return;g.innerHTML='';

    img.setAttribute('preserveAspectRatio','xMidYMid meet');img.setAttributeNS('http://www.w3.org/1999/xlink','href',imgCache[it.id]||'');
    if(imgCache[it.id])g.appendChild(img);});
  // 已试穿清单
  const dl=document.getElementById('dressList');if(dl){dl.innerHTML='';
    dressedIds.forEach(id=>{const it=state.items.find(x=>x.id===id);if(!it)return;const cat=state.categories.find(c=>c.id===it.categoryId);
      const chip=document.createElement('span');chip.className='dress-chip';chip.innerHTML=`${cat?.icon||''} ${esc(it.name)} <button>✕</button>`;
      chip.querySelector('button').onclick=()=>{undress(id);render();};dl.appendChild(chip);});}
}
function toggleDress(it){
  if(dressedIds.includes(it.id)){undress(it.id);return;}
  // 同类替换
  dressedIds=dressedIds.filter(id=>{const ex=state.items.find(i=>i.id===id);return ex?.categoryId!==it.categoryId;});
  dressedIds.push(it.id);
}
function undress(id){dressedIds=dressedIds.filter(x=>x!==id);}
function isDressed(id){return dressedIds.includes(id);}

let chatLog=[{who:'them',text:'你好，我是你的专业搭配顾问 💬\n可以问我任何穿搭问题，比如「黄黑皮怎么选颜色」「小个子显高技巧」～'}];
function answer(question){
  const q=question.toLowerCase();
  const hit=KNOWLEDGE.find(k=>k.k.some(kw=>q.includes(kw)));
  if(hit)return hit.a;
  if(/你好|hi|hello/.test(q))return '你好呀～想聊穿搭的哪方面？可以问我配色、身形、场合穿搭等～';
  return '这是个好问题！一般建议：先确定主色（肤色/季节适配），再按 70/25/5 分配主/辅/点缀色，最后用配饰点睛。\n\n💡 提示：试试问我「黄黑皮配色」「梨形身材」「通勤极简」等更具体的问题，我会给出针对性方案。';
}
function AdvisorView(){
  const node=el(`<div class="view">
    <div class="view-head"><div><h2>${navItems().find(n=>n.id==='advisor')?.label||'专业搭配顾问'}</h2>
      <div class="sub">专业搭配师在线答疑 + 精选配色/穿搭思路推送</div></div></div>
    <div class="advisor">
      <div class="card chat"><div class="chat-log" id="chatLog"></div>
        <div class="chat-input"><input id="chatIn" placeholder="问问搭配师…" />
          <button class="btn" id="send">发送</button></div></div>
      <div class="card feed" id="feed"></div>
    </div>
  </div>`);
  // 聊天
  const log=node.querySelector('#chatLog');
  function renderChat(){
    log.innerHTML='';chatLog.forEach(m=>{
      const d=document.createElement('div');d.className='msg '+(m.who==='me'?'me':'them');
      d.innerHTML=`<div class="bubble">${esc(m.text).replace(/\n/g,'<br>')}</div>`;log.appendChild(d);});
    log.scrollTop=log.scrollHeight;
  }
  const send=()=>{const inp=node.querySelector('#chatIn');const v=inp.value.trim();if(!v)return;
    chatLog.push({who:'me',text:v});inp.value='';renderChat();
    setTimeout(()=>{chatLog.push({who:'them',text:answer(v)});renderChat();},400);};
  node.querySelector('#send').onclick=send;
  node.querySelector('#chatIn').onkeydown=e=>{if(e.key==='Enter')send();};
  renderChat();
  // 灵感推送
  const feed=node.querySelector('#feed');
  state.feed.forEach(f=>{
    const d=document.createElement('div');d.className='feed-item';d.style.background=f.color;
    d.innerHTML=`<span class="star">${f.star?'★':'☆'}</span><div class="ft">${esc(f.title)}</div>
      <div class="fd">${esc(f.desc)}</div><span class="ftag">${esc(f.tag)}</span>`;
    d.querySelector('.star').onclick=(e)=>{e.stopPropagation();f.star=!f.star;saveMeta();render();};
    feed.appendChild(d);
  });
  return node;
}

/* ========== PWA：安装到主屏幕 + 离线缓存 ========== */
(function () {
  // 1) 安装引导横幅
  var banner = document.createElement('div');
  banner.id = 'install-banner';
  banner.innerHTML =
    '<div class="ib-inner">' +
      '<span class="ib-ico">📲</span>' +
      '<div class="ib-txt"><b>添加到主屏幕</b><small>像 App 一样从桌面打开，还能离线用</small></div>' +
      '<button class="ib-btn" id="ib-install">添加</button>' +
      '<button class="ib-close" id="ib-close">✕</button>' +
    '</div>';
  document.body.appendChild(banner);
  // 已安装或已关闭则隐藏
  if (window.matchMedia('(display-mode: standalone)').matches || localStorage.getItem('ib_closed') === '1') {
    banner.style.display = 'none';
  }
  var deferredPrompt;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    banner.style.display = '';
  });
  document.getElementById('ib-install').onclick = function () {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function () { deferredPrompt = null; banner.style.display = 'none'; });
    } else {
      // 系统没触发原生提示时（如 iOS Safari），给出手动指引
      alert('iPhone：点底部"分享" → "添加到主屏幕"\nAndroid：点右上角 ⋮ → "安装应用"');
    }
  };
  document.getElementById('ib-close').onclick = function () {
    banner.style.display = 'none'; localStorage.setItem('ib_closed', '1');
  };
  window.addEventListener('appinstalled', function () { banner.style.display = 'none'; });

  // 2) Service Worker：让 App 离线也能打开（单文件内联 sw，兼容 file:// 与 http）
  if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
    var swSrc = URL.createObjectURL(new Blob([[
      "self.addEventListener('install', function(e){self.skipWaiting();});",
      "self.addEventListener('activate', function(e){e.waitUntil(self.clients.claim());});",
      "self.addEventListener('fetch', function(e){",
      "  e.respondWith(fetch(e.request).then(function(res){return res;}).catch(function(){return new Response('',{status:200});}));",
      "});"
    ].join('\n')], { type: 'application/javascript' }));
    navigator.serviceWorker.register(swSrc).catch(function () { /* 忽略：file:// 下不生效，不影响使用 */ });
  }
})();
