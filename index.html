<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的衣橱</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- 抠图库 @imgly/background-removal（CDN，纯前端抠图） -->
<script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1"></script>

<style>
  :root{
    --pink:#f7c9c9; --pink2:#f4a3a3; --warm:#fff5f3; --ink:#3a2c2c;
    --line:#f0d9d9; --gray:#9a8a8a; --green:#5cb98a; --red:#e26d6d; --blue:#6aa8e0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--warm); color:var(--ink);}
  #app{max-width:480px; margin:0 auto; min-height:100vh; position:relative; background:#fff;}
  .page{display:none; padding:14px 14px 90px;}
  .page.active{display:block;}
  h2{font-size:18px; margin:4px 0 12px;}
  .btn{background:var(--pink2); color:#fff; border:none; border-radius:22px;
    padding:12px 18px; font-size:15px; font-weight:600; cursor:pointer;}
  .btn.ghost{background:#fff; color:var(--pink2); border:1.5px solid var(--pink2);}
  .btn.sm{padding:7px 12px; font-size:13px; border-radius:16px;}
  .card{background:var(--warm); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px;}
  input,select{width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:12px;
    font-size:15px; background:#fff; color:var(--ink); margin-top:4px;}
  label{font-size:13px; color:var(--gray);}

  /* 底部导航 */
  nav{position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto;
    background:#fff; border-top:1px solid var(--line); display:flex; height:64px;}
  nav .tab{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:11px; color:var(--gray); cursor:pointer; gap:2px;}
  nav .tab.on{color:var(--pink2); font-weight:600;}
  nav .tab .ic{font-size:20px;}

  /* 单品网格 */
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .item{position:relative; background:var(--warm); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; aspect-ratio:1/1; cursor:pointer;}
  .item img{width:100%; height:100%; object-fit:cover;}
  .item .loc{position:absolute; left:0; right:0; bottom:0; font-size:10px; color:#fff;
    background:rgba(0,0,0,.45); padding:2px 4px; white-space:nowrap; overflow:hidden;}
  .item .name{position:absolute; top:0; left:0; right:0; font-size:10px; color:#fff;
    background:rgba(0,0,0,.35); padding:2px 4px; white-space:nowrap; overflow:hidden;}
  .item .del{position:absolute; top:3px; right:3px; background:var(--red); color:#fff;
    border:none; border-radius:50%; width:20px; height:20px; font-size:12px; line-height:1; cursor:pointer;}

  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{background:#fff; border:1px solid var(--line); border-radius:16px; padding:6px 12px; font-size:13px; cursor:pointer;}
  .chip.on{background:var(--pink2); color:#fff; border-color:var(--pink2);}

  /* 弹窗 */
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center;
    justify-content:center; z-index:50; padding:20px;}
  .modal.on{display:flex;}
  .panel{background:#fff; border-radius:18px; padding:20px; width:100%; max-width:380px;}
  .panel h3{margin:0 0 14px; font-size:17px;}

  /* 形象区 */
  #avatarCanvas{width:100%; max-width:320px; display:block; margin:0 auto; background:var(--warm);
    border-radius:14px;}
  .swatch{width:22px; height:22px; border-radius:50%; display:inline-block; border:2px solid #fff;
    box-shadow:0 0 0 1px var(--line); cursor:pointer;}
  .swatch.on{box-shadow:0 0 0 2px var(--pink2);}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 登录页 ============ -->
  <div id="loginPage" class="page active" style="padding-top:60px;">
    <div style="text-align:center; margin-bottom:30px;">
      <div style="font-size:44px;">👗</div>
      <h1 style="font-size:26px; color:var(--pink2); margin:8px 0;">我的衣橱</h1>
      <p style="color:var(--gray); font-size:13px;">穿搭管理 · AI 试穿 · 云端同步</p>
    </div>
    <div class="card">
      <label>邮箱</label>
      <input id="email" type="email" placeholder="you@example.com">
      <label style="margin-top:10px;display:block;">密码（≥6位）</label>
      <input id="pwd" type="password" placeholder="设置或登录密码">
      <button class="btn" style="width:100%; margin-top:16px;" onclick="onAuth()">登录 / 注册</button>
    </div>
    <p id="loginMsg" style="color:var(--red); font-size:13px; text-align:center;"></p>
  </div>

  <!-- ============ AI 试穿 / 形象页 ============ -->
  <div id="tryonPage" class="page">
    <h2>我的 AI 形象</h2>
    <div class="card">
      <canvas id="avatarCanvas" width="360" height="520"></canvas>
      <button class="btn ghost sm" style="margin-top:10px;" onclick="openUpload()">重新上传照片</button>
    </div>
    <div class="card">
      <label>体型</label>
      <select id="bodyType" onchange="drawAvatar()">
        <option value="slim">纤瘦</option><option value="normal" selected>标准</option>
        <option value="curvy">丰满</option><option value="athletic">健美</option>
      </select>
      <div class="row" style="margin-top:10px;">
        <div style="flex:1;"><label>身高 <span id="hVal">165</span> cm</label>
          <input type="range" id="height" min="140" max="195" value="165" oninput="drawAvatar()"></div>
        <div style="flex:1;"><label>体重 <span id="wVal">55</span> kg</label>
          <input type="range" id="weight" min="35" max="120" value="55" oninput="drawAvatar()"></div>
      </div>
      <div class="row" style="margin-top:10px;">
        <div style="flex:1;"><label>肤色</label>
          <div class="chips" id="skinChips"></div></div>
        <div style="flex:1;"><label>发色</label>
          <div class="chips" id="hairChips"></div></div>
      </div>
      <button class="btn" style="width:100%; margin-top:14px;" onclick="generateTryon()">生成 AI 试穿图</button>
    </div>

    <h2>试穿单品</h2>
    <div class="chips" id="catChips" style="margin-bottom:10px;"></div>
    <div class="grid" id="itemGrid"></div>
    <button class="btn ghost sm" onclick="openUpload(true)">+ 添加单品</button>
  </div>

  <!-- ============ 我的 / 个人操作中心 ============ -->
  <div id="mePage" class="page">
    <h2>个人操作中心</h2>
    <div class="card">
      <p style="margin:0;">账号：<b id="meEmail">-</b></p>
      <button class="btn ghost sm" style="margin-top:10px;" onclick="logout()">退出登录</button>
    </div>

    <div class="card">
      <h3 style="margin:0 0 10px;">🔑 AI 形象引擎（混元）</h3>
      <label>混元 API Key</label>
      <input id="hunyuanKey" placeholder="sk-xxx... 或 SecretKey">
      <label style="margin-top:8px;display:block;">启用真实 AI 出图</label>
      <select id="realAI" onchange="saveSettings()">
        <option value="off">关（离线模拟）</option><option value="on">开（需填入 Key）</option>
      </select>
    </div>

    <div class="card">
      <h3 style="margin:0 0 10px;">☁️ 同步（Supabase）</h3>
      <label>Project URL</label>
      <input id="sbUrl" placeholder="https://xxx.supabase.co">
      <label style="margin-top:8px;display:block;">anon public key</label>
      <input id="sbAnon" placeholder="eyJhbGci...">
      <button class="btn sm" style="margin-top:10px;" onclick="initSupabase()">连接 / 保存</button>
      <span id="syncStatus" style="font-size:12px; color:var(--gray); margin-left:8px;"></span>
    </div>

    <div class="card">
      <h3 style="margin:0 0 10px;">🔒 修改密码</h3>
      <input id="newPwd" type="password" placeholder="新密码（≥6位）">
      <button class="btn sm" style="margin-top:10px;" onclick="changePwd()">更新密码</button>
    </div>

    <div class="card">
      <h3 style="margin:0 0 10px;">📂 形象照管理</h3>
      <p style="font-size:12px; color:var(--gray); margin:0;">照片存放于专属空间（avatars），与「配饰」分类独立。</p>
      <button class="btn ghost sm" style="margin-top:8px;" onclick="openUpload()">上传 / 重命名形象照</button>
    </div>
  </div>

  <!-- ============ 底部导航 ============ -->
  <nav>
    <div class="tab on" data-p="tryonPage" onclick="switchTab('tryonPage',this)">
      <span class="ic">👤</span>形象</div>
    <div class="tab" data-p="mePage" onclick="switchTab('mePage',this)">
      <span class="ic">👤</span>我的</div>
  </nav>

</div>

<!-- ============ 上传 / 编辑弹窗 ============ -->
<div class="modal" id="uploadModal">
  <div class="panel">
    <h3 id="upTitle">上传图片</h3>
    <label>名称（可重命名）</label>
    <input id="upName" placeholder="例如：黑色连衣裙、我的全身照">
    <label style="margin-top:10px;display:block;">分类</label>
    <select id="upCat">
      <option value="avatar">个人形象照</option>
      <option value="top">上装</option><option value="bottom">下装</option>
      <option value="dress">连衣裙</option><option value="coat">外套</option>
      <option value="shoe">鞋子</option><option value="bag">包包</option>
      <option value="acc">配饰</option>
    </select>
    <!-- 存放位置：下拉预置 + 自定义（两者结合） -->
    <label style="margin-top:10px;display:block;">存放位置</label>
    <select id="upLocPreset" onchange="onLocPreset()">
      <option value="">— 选择常用位置 —</option>
      <option value="衣柜·上层">衣柜·上层</option>
      <option value="衣柜·中层">衣柜·中层</option>
      <option value="衣柜·下层">衣柜·下层</option>
      <option value="抽屉·内衣">抽屉·内衣</option>
      <option value="玄关·鞋柜">玄关·鞋柜</option>
      <option value="收纳箱A">收纳箱A</option>
      <option value="__custom">✏️ 自定义位置…</option>
    </select>
    <input id="upLoc" placeholder="或在此输入自定义位置">
    <label style="margin-top:10px;display:block;">选择图片</label>
    <input id="upFile" type="file" accept="image/*">
    <div class="row" style="margin-top:16px;">
      <button class="btn ghost" style="flex:1;" onclick="closeUpload()">取消</button>
      <button class="btn" style="flex:1;" onclick="doUpload()">保存</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   全局状态
============================================================ */
let SB = null;        // Supabase client
let user = null;
let items = [];       // 单品/形象照列表
let editingId = null; // 编辑中的记录 id（null=新增）

const CATS = ['avatar','top','bottom','dress','coat','shoe','bag','acc'];
const CAT_LABEL = {avatar:'形象照',top:'上装',bottom:'下装',dress:'连衣裙',coat:'外套',
                   shoe:'鞋子',bag:'包包',acc:'配饰'};
const LOC_PRESETS = ['衣柜·上层','衣柜·中层','衣柜·下层','抽屉·内衣','玄关·鞋柜','收纳箱A'];
const SKINS = ['#f5d6b0','#eec48a','#d9a066','#b87b3f','#8a5320'];
const HAIRS = ['#1a1a1a','#3b2a1a','#7a4a2a','#c08457','#d4b060','#a0a0a0'];

let curSkin = SKINS[1], curHair = HAIRS[2], curCat = 'top';

/* ============================================================
   工具
============================================================ */
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2,10);

function switchTab(pageId, el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $(pageId).classList.add('active');
  document.querySelectorAll('nav .tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  if(pageId==='tryonPage') renderItems();
}

/* ============================================================
   Supabase 初始化（配置存 localStorage）
============================================================ */
function cfg(){ return JSON.parse(localStorage.getItem('sb_cfg')||'{}'); }

function initSupabase(){
  const url = $('sbUrl').value.trim(), anon = $('sbAnon').value.trim();
  if(!url||!anon){ $('syncStatus').textContent='请填写完整'; return; }
  try{
    SB = window.supabase.createClient(url, anon);
    localStorage.setItem('sb_cfg', JSON.stringify({url, anon}));
    $('syncStatus').textContent='✅ 已连接';
    bindAuth();
    loadItems();
  }catch(e){ $('syncStatus').textContent='❌ '+e.message; }
}

function bindAuth(){
  SB.auth.onAuthStateChange((_, sess)=>{
    user = sess?.user || null;
    if(user){ $('meEmail').textContent = user.email; }
  });
}

/* ============================================================
   登录 / 注册（密码方式）
============================================================ */
async function onAuth(){
  const email = $('email').value.trim(), pwd = $('pwd').value;
  $('loginMsg').textContent='';
  if(!email||pwd.length<6){ $('loginMsg').textContent='密码至少6位'; return; }
  if(!SB){ $('loginMsg').textContent='请先在「我的→同步」填写 Supabase 配置并连接'; return; }
  // 先尝试登录，失败则注册
  let { data, error } = await SB.auth.signInWithPassword({email, password:pwd});
  if(error && /Invalid|invalid/i.test(error.message)){
    ({ data, error } = await SB.auth.signUp({email, password:pwd}));
  }
  if(error){ $('loginMsg').textContent = error.message; return; }
  user = data.user;
  if(user){ $('meEmail').textContent = user.email; switchTab('tryonPage', document.querySelector('nav .tab')); }
}

async function logout(){ await SB?.auth.signOut(); location.reload(); }

async function changePwd(){
  const np = $('newPwd').value;
  if(np.length<6){ alert('密码至少6位'); return; }
  const { error } = await SB.auth.updateUser({password:np});
  alert(error ? '失败：'+error.message : '密码已更新');
  $('newPwd').value='';
}

function saveSettings(){
  localStorage.setItem('ai_cfg', JSON.stringify({
    key: $('hunyuanKey').value, real: $('realAI').value
  }));
}

/* ============================================================
   上传 / 编辑（抠图 + 重命名 + 存放位置）
============================================================ */
function openUpload(asItem){
  editingId = null;
  $('upTitle').textContent = asItem ? '添加单品' : '上传形象照';
  $('upCat').value = asItem ? 'top' : 'avatar';
  $('upName').value = '';
  $('upLoc').value = '';
  $('upLocPreset').value = '';
  $('uploadModal').classList.add('on');
}

function editItem(it){
  editingId = it.id;
  $('upTitle').textContent = '编辑';
  $('upName').value = it.name || '';
  $('upCat').value = it.cat;
  $('upLoc').value = LOC_PRESETS.includes(it.location) ? '' : (it.location||'');
  $('upLocPreset').value = LOC_PRESETS.includes(it.location) ? it.location : '__custom';
  $('uploadModal').classList.add('on');
}

function onLocPreset(){
  const v = $('upLocPreset').value;
  if(v==='__custom'){ $('upLoc').value=''; $('upLoc').focus(); }
  else { $('upLoc').value = v; }
}

function closeUpload(){ $('uploadModal').classList.remove('on'); }

async function doUpload(){
  const name = $('upName').value.trim() || ($('upFile').files[0]?.name.replace(/\.[^/.]+$/,'') || ('未命名_'+uid()));
  const cat = $('upCat').value;
  const location = $('upLoc').value.trim() || $('upLocPreset').value || '未分类';
  const file = $('upFile').files[0];

  let imgUrl = null, maskUrl = null;

  if(file){
    // 1) 上传原图到 Storage（avatars 桶，按用户隔离）
    const path = `${user?.id||'public'}/${uid()}_${file.name}`;
    if(SB){
      const { error } = await SB.storage.from('avatars').upload(path, file);
      if(!error){ const { data } = SB.storage.from('avatars').getPublicUrl(path); imgUrl = data.publicUrl; }
    }
    // 2) 前端抠图 → 透明 PNG（@imgly/background-removal）
    try{
      const removed = await removeBackground(file);
      const blob = await (await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1')).blobToDataURL(removed);
      maskUrl = blob; // 本地预览用 dataURL；如需持久化可一并上传 Storage
    }catch(e){ console.warn('抠图失败，跳过：', e); }
  }

  const record = {
    user_id: user?.id || 'local',
    name, cat, location,
    image_url: imgUrl,
    mask_url: maskUrl,
    updated_at: new Date().toISOString()
  };

  if(editingId){
    // 更新（重命名 / 改位置）
    const idx = items.findIndex(i=>i.id===editingId);
    if(idx>=0){ items[idx] = {...items[idx], ...record}; }
    if(SB){ await SB.from('outfits').update(record).eq('id', editingId); }
  }else{
    record.id = uid();
    record.created_at = record.updated_at;
    items.push(record);
    if(SB){ const { data } = await SB.from('outfits').insert(record).select(); if(data?.[0]) Object.assign(record, data[0]); }
  }

  closeUpload();
  renderItems();
  drawAvatar();
}

/* 删除 */
async function delItem(id, e){
  e.stopPropagation();
  if(!confirm('删除这件？')) return;
  items = items.filter(i=>i.id!==id);
  if(SB){ await SB.from('outfits').delete().eq('id', id); }
  renderItems();
}

/* ============================================================
   渲染：分类 + 网格（名称 + 存放位置标签）
============================================================ */
function renderItems(){
  // 分类 chips
  const chips = $('catChips');
  chips.innerHTML = CATS.map(c=>`<span class="chip ${c===curCat?'on':''}" onclick="setCat('${c}')">${CAT_LABEL[c]}</span>`).join('');
  // 网格
  const list = items.filter(i=>i.cat===curCat);
  const grid = $('itemGrid');
  grid.innerHTML = list.map(i=>`
    <div class="item" onclick='editItem(${JSON.stringify(i).replace(/'/g,"")})'>
      ${i.image_url ? `<img src="${i.image_url}">` : `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--gray);font-size:11px;">${i.name||'无图'}</div>`}
      <div class="name">${i.name||''}</div>
      <div class="loc">📍 ${i.location||'未分类'}</div>
      <button class="del" onclick="delItem('${i.id}',event)">×</button>
    </div>`).join('') || `<p style="color:var(--gray);font-size:13px;">暂无，点下方「+ 添加单品」</p>`;
}

function setCat(c){ curCat = c; renderItems(); }

async function loadItems(){
  if(!SB||!user) return;
  const { data } = await SB.from('outfits').select().eq('user_id', user.id).order('updated_at',{ascending:false});
  items = data || [];
  renderItems();
  drawAvatar();
}

/* ============================================================
   AI 形象绘制（参数化：身高/体重/体型 + 真人抠图叠加）
============================================================ */
function drawAvatar(){
  const cv = $('avatarCanvas'), ctx = cv.getContext('2d');
  const W=cv.width, H=cv.height;
  ctx.clearRect(0,0,W,H);
  // 背景
  ctx.fillStyle='#fff5f3'; ctx.fillRect(0,0,W,H);

  const h = +$('height').value, w = +$('weight').value;
  $('hVal').textContent=h; $('wVal').textContent=w;

  // 体型 → 肩宽/腰宽系数
  const bt = $('bodyType').value;
  const widthMap = {slim:.8, normal:1, curvy:1.15, athletic:1.05};
  const f = widthMap[bt] * (w/60); // 体重影响宽度

  const cx=W/2;
  const headR=26;
  const bodyTop=70, bodyH = 200 * (h/165); // 身高影响身长
  const shoulder = 46*f, hip = 40*f, legW = 30*f;

  // 头
  ctx.fillStyle=curSkin;
  ctx.beginPath(); ctx.arc(cx, bodyTop-headR+6, headR, 0, Math.PI*2); ctx.fill();
  // 发型
  ctx.fillStyle=curHair;
  ctx.beginPath(); ctx.arc(cx, bodyTop-headR, headR+4, Math.PI, Math.PI*2); ctx.fill();
  // 身体
  ctx.fillStyle=curSkin;
  ctx.beginPath();
  ctx.moveTo(cx-shoulder, bodyTop);
  ctx.quadraticCurveTo(cx, bodyTop+bodyH*0.55+ (bt==='curvy'?20:0), cx-hip, bodyTop+bodyH);
  ctx.lineTo(cx+hip, bodyTop+bodyH);
  ctx.quadraticCurveTo(cx, bodyTop+bodyH*0.55+ (bt==='curvy'?20:0), cx+shoulder, bodyTop);
  ctx.fill();
  // 腿
  ctx.fillRect(cx-legW-4, bodyTop+bodyH, legW, bodyH*0.55);
  ctx.fillRect(cx+4, bodyTop+bodyH, legW, bodyH*0.55);

  // 若有抠图结果，叠加在头部区域
  const avatar = items.find(i=>i.cat==='avatar' && i.mask_url);
  if(avatar && avatar.mask_url){
    const img = new Image();
    img.onload=()=>{ ctx.drawImage(img, cx-55, bodyTop-headR-10, 110, 140); };
    img.src = avatar.mask_url;
  }
}

async function generateTryon(){
  const cfgAI = JSON.parse(localStorage.getItem('ai_cfg')||'{}');
  if(cfgAI.real==='on' && cfgAI.key){
    alert('真实 AI 出图已启用（混元 Key 已读取）。\n本版将在此接入生图 API；\n当前先完成参数化形象，可在「我的」切换。');
  }else{
    drawAvatar();
    alert('已生成（离线模拟）。\n填入混元 Key 并开启「真实 AI」可升级效果。');
  }
}

/* ============================================================
   初始化
============================================================ */
function initChips(){
  $('skinChips').innerHTML = SKINS.map(s=>`<span class="swatch ${s===curSkin?'on':''}" style="background:${s}" onclick="curSkin='${s}';drawAvatar()"></span>`).join('');
  $('hairChips').innerHTML = HAIRS.map(s=>`<span class="swatch ${s===curHair?'on':''}" style="background:${s}" onclick="curHair='${s}';drawAvatar()"></span>`).join('');
}

(function start(){
  initChips();
  // 恢复设置
  const c = JSON.parse(localStorage.getItem('ai_cfg')||'{}');
  if(c.key) $('hunyuanKey').value=c.key; if(c.real) $('realAI').value=c.real;
  const sb = cfg();
  if(sb.url){ $('sbUrl').value=sb.url; $('sbAnon').value=sb.anon; initSupabase(); }
  renderItems();
  drawAvatar();
})();
</script>
</body>
